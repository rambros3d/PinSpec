<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinCraft — STM32 Pinout Configurator</title>
    <meta
      name="description"
      content="Fast, static CubeMX-style STM32 pinout configurator with perimeter and BGA package renderers, conflict checking, remap discovery, URL sharing, and Embassy Rust / C / CSV / JSON exports."
    />
    <meta property="og:title" content="PinCraft — STM32 Pinout Configurator" />
    <meta
      property="og:description"
      content="Fast, static CubeMX-style STM32 pinout configurator with perimeter and BGA package renderers, conflict checking, remap discovery, URL sharing, and Embassy Rust / C / CSV / JSON exports."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://api.fonts.coollabs.io" crossorigin />
    <link
      href="https://api.fonts.coollabs.io/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pincraft:theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#0b0e14] dark:text-[#e5e7eb] antialiased selection:bg-sky-500/25">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
