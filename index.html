<!doctype html>
<html lang="en" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinCraft — STM32 / CH32 / RP Pinout Configurator</title>
    <meta
      name="description"
      content="Fast, static CubeMX-style STM32 / CH32 / RP pinout configurator with perimeter and BGA package renderers, conflict checking, remap discovery, URL sharing, and vendor-aware Rust / C / CSV / JSON exports."
    />
    <meta property="og:title" content="PinCraft — STM32 / CH32 / RP Pinout Configurator" />
    <meta
      property="og:description"
      content="Fast, static CubeMX-style STM32 / CH32 / RP pinout configurator with perimeter and BGA package renderers, conflict checking, remap discovery, URL sharing, and vendor-aware Rust / C / CSV / JSON exports."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://api.fonts.coollabs.io" crossorigin />
    <link
      href="https://api.fonts.coollabs.io/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- No-FOUC theme bootstrap: mirrors src/state/theme.svelte.ts. -->
    <script>
      (function () {
        var ids = ['lofi', 'forest', 'caramellatte', 'halloween'];
        var theme = 'forest';
        try {
          var stored = localStorage.getItem('pincraft:theme');
          if (stored === 'dark') stored = 'forest';
          if (stored === 'light') stored = 'lofi';
          if (ids.indexOf(stored) !== -1) {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'lofi';
          }
        } catch (e) {
          // Storage unavailable: keep the dark-first default.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="bg-base-200 text-foreground antialiased selection:bg-info/25">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
