<!doctype html>
<html lang="en" data-theme="fantasy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinCraft — STM32 / CH32 / RP / ESP32 / Microchip SAM / Nordic Pinout Configurator</title>
    <meta
      name="description"
      content="Fast, static CubeMX-style STM32 / CH32 / RP / ESP32 / Microchip SAM / Nordic pinout configurator with perimeter and BGA package renderers, conflict checking, remap discovery, URL sharing, and vendor-aware Rust / C / CSV / JSON exports."
    />
    <meta property="og:title" content="PinCraft — STM32 / CH32 / RP / ESP32 / Microchip SAM / Nordic Pinout Configurator" />
    <meta
      property="og:description"
      content="Fast, static CubeMX-style STM32 / CH32 / RP / ESP32 / Microchip SAM / Nordic pinout configurator with perimeter and BGA package renderers, conflict checking, remap discovery, URL sharing, and vendor-aware Rust / C / CSV / JSON exports."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://api.fonts.coollabs.io" crossorigin />
    <link
      href="https://api.fonts.coollabs.io/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- No-FOUC theme bootstrap: mirrors src/state/theme.svelte.ts. -->
    <script>
      (function () {
        var modes = ['system', 'light', 'dark'];
        var mode = 'system';
        try {
          var stored = localStorage.getItem('pincraft:theme');
          if (modes.indexOf(stored) !== -1) mode = stored;
        } catch (e) {
          // Storage unavailable: keep system mode.
        }
        var prefersDark = false;
        try {
          prefersDark = !!(
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          );
        } catch (e) {
          // Color scheme unavailable: use the light baseline.
        }
        document.documentElement.dataset.theme =
          mode === 'dark' || (mode === 'system' && prefersDark) ? 'halloween' : 'fantasy';
      })();
    </script>
  </head>
  <body class="bg-base-200 text-foreground antialiased selection:bg-info/25">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
